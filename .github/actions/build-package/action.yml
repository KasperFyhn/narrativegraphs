name: "Build and Verify Package"
description: "Build the narrativegraphs package with frontend"
runs:
  using: "composite"
  steps:
    - name: Set up uv with Python 3.12
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Build and verify package
      shell: bash
      run: uv run --locked ./scripts/build.sh
