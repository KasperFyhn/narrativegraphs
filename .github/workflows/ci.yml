name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Lint
        run: uvx ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Test setup
        run: uv run ./tests/setup.sh

      - name: Test with pytest
        run: uv run pytest tests

  test-lowest:
    # Keeps the lower bounds in pyproject.toml honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - name: List resolved versions
        run: uv run --isolated --resolution lowest-direct uv pip list

      - name: Test setup
        run: uv run --isolated --resolution lowest-direct ./tests/setup.sh

      - name: Test with pytest
        run: uv run --isolated --resolution lowest-direct pytest tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-package
