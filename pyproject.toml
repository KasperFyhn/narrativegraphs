[build-system]
requires = ["setuptools>=64.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "narrativegraphs"
dynamic = ["version"]
description = "A package for creating and analyzing narrative graphs from text corpora"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kasper Fyhn", email = "kasperfyhnjacobsen@gmail.com" }
]
keywords = [
    "nlp",
    "narrative-analysis",
    "network-analysis",
    "computational-linguistics",
    "text-mining"
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pydantic>=2.5",
    "sqlalchemy>=2.0.10",
    "pandas>=2.0",
    "spacy>=3.7",
    "scikit-learn>=1.3",
    "tqdm>=4.60",
    "nltk>=3.8.2",
    "uvicorn>=0.30",
    "fastapi>=0.100",
    "nest-asyncio>=1.5",
    "fastapi_camelcase>=2.0.0",
    "psutil>=5.9",
    "numpy>=1.26",
    "networkx>=3.0",
    # LLM clients. Thin HTTP SDKs next to spaCy and scikit-learn, and asking
    # for an extra before a model can be prompted costs more than it saves.
    # "openai" covers any OpenAI-compatible server: OpenAI, LM Studio, Ollama, vLLM.
    "anthropic>=1.0.0",
    "openai>=1.30"
]

[project.optional-dependencies]
coref-fastcoref = ["fastcoref>=2.1.3"]

# Corpora for the demo notebooks, scripts/ and examples/. Nothing in the
# package imports these: they fetch the texts the demos are built from, so they
# are only needed to run a demo or build the docs, not to use the library.
demo = [
    "kagglehub>=0.4.1",
    "gutenbergpy>=0.3.5"
]

docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.24",
    "narrativegraphs[demo]"  # notebooks are executed at build time
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.14",
    "build>=1.3.0",
    "twine>=6.2.0",
    "pre-commit>=3.5",
    "pip>=23",  # `python -m spacy download` shells out to pip
]

[project.urls]
Documentation = "https://kasperfyhn.github.io/narrativegraphs"
Repository = "https://github.com/KasperFyhn/narrativegraphs"
"Bug Tracker" = "https://github.com/your-username/narrativegraphs/issues"

[tool.setuptools_scm]
write_to = "narrativegraphs/_version.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["narrativegraphs*"]

[tool.setuptools.package-data]
narrativegraphs = ["server/static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tests/integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []